# 敏感配置 → Secret（本文件是模板，真实值绝不提交仓库！）
#
# 生产正确姿势（三选一，安全性递增）：
#   1. CI/CD 流水线里 kubectl create secret generic ... --from-literal=...
#   2. Sealed Secrets：加密后的 Secret 可以安全进 git
#   3. External Secrets Operator / Vault：K8s 只持有引用，真实值在专用密管系统
#
# 生成强随机 key：python -c "import secrets; print(secrets.token_urlsafe(32))"
apiVersion: v1
kind: Secret
metadata:
  name: openrag-forge-secrets
  labels:
    app: openrag-forge
type: Opaque
stringData:
  OPENRAG_API_KEY: "REPLACE-ME-with-a-long-random-string"
  OPENRAG_QDRANT_API_KEY: ""
  OPENRAG_MODEL_API_KEY: ""
