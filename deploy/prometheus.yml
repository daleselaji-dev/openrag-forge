# =============================================================================
# Prometheus 抓取配置
#
# 生效位置：docker-compose.yml 挂载到 prometheus 容器。
# K8s 部署时不用这个文件，改用 Prometheus Operator 的 ServiceMonitor
# 或 pod 注解（prometheus.io/scrape: "true"）自动发现。
# =============================================================================

global:
  scrape_interval: 15s     # 生产常用 15~30s；更密只会放大存储成本，不会更准
  evaluation_interval: 15s

scrape_configs:
  - job_name: openrag-forge
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: openrag-forge

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

