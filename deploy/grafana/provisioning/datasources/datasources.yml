# Grafana 数据源自动装配（Provisioning as Code）
# 教学点：不要手工在 UI 里点配置——声明式装配让 Grafana 容器销毁重建后
# 配置零丢失，也能进代码评审。仪表盘同理可放 provisioning/dashboards/。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    # 配好之后：在 Grafana Explore 选 Jaeger 数据源，粘贴日志里的 trace_id
    # 即可从"一条报错日志"直接跳到"完整调用链瀑布图"
