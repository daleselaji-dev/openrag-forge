# CI 即质量门禁：lint（风格与隐蔽 bug）→ 测试（含生产能力回归）→ 前端构建。
# 教学点：安装 observability extra 后再跑测试，保证 OTel/Prometheus 相关
# 代码路径在 CI 中被真实执行，而不是永远走"未安装"降级分支。
name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,observability]"
      - run: ruff check src tests
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
