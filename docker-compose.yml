services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports: ["16333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  api:
    build: .
    ports: ["18000:8000"]
    environment:
      OPENRAG_PROFILE: lite
      OPENRAG_QDRANT_URL: http://qdrant:6333
      OPENRAG_DATA_DIR: /app/data
    volumes: [./data:/app/data]
    depends_on: [qdrant]

  postgres:
    image: postgres:16-alpine
    profiles: [production]
    environment:
      POSTGRES_DB: openrag
      POSTGRES_USER: openrag
      POSTGRES_PASSWORD: change-me
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    profiles: [production]
    volumes: [redis_data:/data]

  minio:
    image: minio/minio:latest
    profiles: [production]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openrag
      MINIO_ROOT_PASSWORD: change-me-now
    volumes: [minio_data:/data]

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  minio_data:

